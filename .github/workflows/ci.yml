# Continuous Integration: validates every Pull Request into main.
# Responsibilities: test, validate, build-check. It never publishes an artifact.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependency installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: student-ml-api:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 5000:5000 student-ml-api:ci-${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && break
            sleep 1
          done
          echo
          response=$(curl -fsS http://localhost:5000/health)
          expected=$(tr -d '[:space:]' < VERSION)
          echo "$response" | grep -q "\"version\":\"$expected\"" \
            || { echo "::error::/health did not report version $expected"; docker logs smoke; exit 1; }
          curl -fsS -X POST http://localhost:5000/predict \
            -H 'Content-Type: application/json' -d '{"value": 10}' | grep -q '"prediction":20'

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
